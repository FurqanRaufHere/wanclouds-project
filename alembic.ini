
# Alembic configuration file
#  This is the main config file Alembic reads when you run any alembic command (like "alembic upgrade head").

[alembic]
script_location = alembic

# We override this in env.py using our config.py DATABASE_URL
# So this placeholder won't actually be used
sqlalchemy.url = mysql+pymysql://appuser:apppassword@localhost:3306/appdb

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S