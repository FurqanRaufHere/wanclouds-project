[alembic]
script_location = alembic

# Revision hash only, no description slug. Alembic's default is
# %(rev)s_%(slug)s, which would append the -m message to the filename;
# pinning the template keeps the naming consistent even when -m is passed.
# The message is still recorded in each file's docstring.
file_template = %%(rev)s_

sqlalchemy.url = driver://user:pass@localhost/dbname

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
