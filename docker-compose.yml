version: "3.9"

# services:
#   api:
#     build: .
#     container_name: fastapi_app
#     ports:
#       - "8000:8000"
#     volumes:
#       - ./app:/app/app
#       - ./logs:/app/logs
#     restart: unless-stopped


#  This file defines ALL the containers (services) that make
#  up your application. Think of it as the blueprint for your
#  entire system.

#  WE NOW HAVE 3 SERVICES:
#  1. api       → your main FastAPI app (auth + predict)
#  2. service2  → second microservice (talks to service 1)
#  3. mysql     → the database server

#  Docker containers are isolated by default. They can't see
#  each other unless they're on the same network.

#  We define TWO networks:
#
#  frontend (external-facing):
#    → Used by services that need to be reached from outside
#      (your browser, Postman). The "api" and "service2"
#      containers are on this network.

#  backend (internal only):
#    → Used for internal communication only. The "api" and
#      "mysql" containers are on this network.
#    → MySQL should NEVER be directly exposed to the internet.
#      It only talks to the app, not to Postman.

#  HOW SERVICE NAMES WORK AS HOSTNAMES:
#  When containers are on the same Docker network, they can
#  reach each other using the SERVICE NAME as the hostname.
#  So "api" can reach "mysql" at hostname "mysql".
#  And "service2" can reach "api" at hostname "api".

services:

  # ─────────────────────────────────────────────────────────
  #  SERVICE 1: api — Main FastAPI app
  # ─────────────────────────────────────────────────────────
  api:
    build: .
    container_name: fastapi_app
    ports:
      - "8000:8000"       # Exposed to outside world (Postman)
    volumes:
      - ./app:/app/app
      - ./logs:/app/logs
    environment:
      # These env vars are read by config.py
      # Instead of hardcoding DB credentials in code,
      # we pass them in through environment variables.
      - MYSQL_HOST=mysql          # hostname = service name
      - MYSQL_PORT=3306
      - MYSQL_USER=appuser
      - MYSQL_PASSWORD=apppassword
      - MYSQL_DB=appdb
    depends_on:
      mysql:
        condition: service_healthy # Wait for MySQL to be healthy before starting
    networks:
      - frontend    # reachable from outside (Postman)
      - backend     # can reach mysql internally
    restart: unless-stopped


  #  This is a completely separate FastAPI app in its own container. It has ONE job: demonstrate microservice communication by calling Service 1's API.
  #  depends_on: api → Docker starts "api" before "service2"
  #  But note: depends_on only waits for the container to START, not for the app inside to be READY.
  # ─────────────────────────────────────────────────────────
  service2:
    build: ./service2        # has its own Dockerfile
    container_name: fastapi_service2
    ports:
      - "8001:8001"          # different port, also exposed
    environment:
      - SERVICE1_URL=http://api:8000   # how service2 reaches service1
    depends_on:
      - api
    networks:
      - frontend    # reachable from outside (Postman on port 8001)
    volumes:
    - ./service2/app:/app/app
    restart: unless-stopped


  #  VOLUMES:
  #  mysql_data is a "named volume" — Docker manages it.
  #  This means your database data PERSISTS even if you
  #  stop/remove the container. Without this, all your
  #  data would be lost every time you restart.
  mysql:
    image: mysql:8.0          # official MySQL image, no custom Dockerfile needed
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword    # root superuser password
      MYSQL_DATABASE: appdb               # auto-creates this database
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql_data:/var/lib/mysql         # persist data across restarts
    networks:
      - backend     # ONLY on internal network, not exposed
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped


#  frontend: containers that need to be reachable from outside
#  backend:  containers that only talk to each other internally
#  driver: bridge → the standard Docker network type.
#  "bridge" creates a private internal network on your machine.
#  Containers on the same bridge network can reach each other
#  by service name.
# ============================================================
networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  mysql_data: